// --- sesión con renovación automática ---
function tokenGuardado() { try { return localStorage.getItem('vv_token'); } catch { return null; } }
function refreshGuardado() { try { return localStorage.getItem('vv_refresh'); } catch { return null; } }
function guardarToken(t, r) {
  try {
    localStorage.setItem('vv_token', (t || '').trim());
    if (r) localStorage.setItem('vv_refresh', (r || '').trim());
  } catch {}
}
function cerrarSesion() {
  try { localStorage.removeItem('vv_token'); localStorage.removeItem('vv_refresh'); } catch {}
}
async function renovarSesion() {
  const refresh = refreshGuardado();
  if (!refresh) return null;
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: SUPA_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    const d = await r.json();
    if (!r.ok) return null;
    guardarToken(d.access_token, d.refresh_token);
    return d.access_token;
  } catch { return null; }
}
async function iniciarSesionConCredenciales(email, clave) {
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPA_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: clave }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || 'No se pudo iniciar sesión');
  guardarToken(d.access_token, d.refresh_token);
  return d.access_token;
}
async function pedirRecuperarClave(email) {
  const r = await fetch(`${SUPA_URL}/auth/v1/recover`, {
    method: 'POST',
    headers: { apikey: SUPA_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error_description || d.msg || 'No se pudo enviar el mail de recuperación');
  }
}

// ---------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------
async function api(path, opts = {}, _reintentado) {
  const token = tokenGuardado();
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: {
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && !_reintentado) {
    const renovado = await renovarSesion();
    if (renovado) return api(path, opts, true);
  }
  const texto = await res.text();
  let data = {};
  try { data = texto ? JSON.parse(texto) : {}; } catch {}
  if (!res.ok) throw Object.assign(new Error(data.error || (texto ? texto.slice(0, 300) : `Error ${res.status}`)), { status: res.status, data });
  return data;
}

// Llama directo a la API REST de Supabase (tablas), con la sesión del
// usuario logueado — igual que hace V+V. No pasa por ninguna función
// propia: lee/escribe directo, protegido por los permisos (RLS) que
// dejamos en la migración 007. Reintenta una vez si el token venció.
async function vvFetch(ruta, opciones, _reintentado) {
  const t = tokenGuardado() || SUPA_ANON_KEY;
  const res = await fetch(`${SUPA_URL}/rest/v1/${ruta}`, {
    ...opciones,
    headers: {
      apikey: SUPA_ANON_KEY,
      Authorization: `Bearer ${t}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
      ...(opciones && opciones.headers),
    },
  });
  if (res.status === 401 && !_reintentado) {
    const renovado = await renovarSesion();
    if (renovado) return vvFetch(ruta, opciones, true);
  }
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`${res.status} · ${txt.slice(0, 200)}`);
  }
  const cuerpo = await res.text();
  return cuerpo ? JSON.parse(cuerpo) : null;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function navigate(path) {
  window.history.pushState({}, '', path);
  window.dispatchEvent(new PopStateEvent('popstate'));
}

function LeadForm() {
  const [form, setForm] = useState({ nombre: '', email: '', telefono: '', empresa: '', situacion: 'Conflicto entre socios', mensaje: '' });
  const [status, setStatus] = useState('idle');

  function update(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus('sending');
    try {
      const [lead] = await vvFetch('leads', { method: 'POST', body: JSON.stringify(form) });
      setStatus('sent');
      // El mail de confirmación sí necesita una función propia (usa la
      // clave de Resend, que nunca puede estar en el navegador).
      fetch('/api/notificar-lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(lead),
      }).catch(() => {});
    } catch {
      setStatus('error');
    }
  }

  if (status === 'sent') {
    return (
      <div style={{ border: '1px solid var(--line)', background: 'rgba(255,255,255,0.6)', borderRadius: 20, padding: 32, textAlign: 'center' }}>
        <p className="display" style={{ fontStyle: 'italic', fontSize: 20 }}>Mensaje recibido.</p>
        <p style={{ marginTop: 8, fontSize: 14, color: 'var(--ink-soft)' }}>Valentina lee cada consulta personalmente y responde dentro de 48hs hábiles.</p>
      </div>
    );
  }

  const inputStyle = { border: '1px solid var(--line)', background: 'white', padding: '10px 14px', borderRadius: 10, fontSize: 14, width: '100%' };

  return (
    <form onSubmit={handleSubmit} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
      <Field label="Nombre"><input required style={inputStyle} value={form.nombre} onChange={update('nombre')} /></Field>
      <Field label="Empresa (opcional)"><input style={inputStyle} value={form.empresa} onChange={update('empresa')} /></Field>
      <Field label="Email"><input type="email" required style={inputStyle} value={form.email} onChange={update('email')} /></Field>
      <Field label="Teléfono"><input style={inputStyle} value={form.telefono} onChange={update('telefono')} /></Field>
      <div style={{ gridColumn: '1 / -1' }}>
        <Field label="La situación se parece más a">
          <select style={inputStyle} value={form.situacion} onChange={update('situacion')}>
            {['Conflicto entre socios', 'Padres e hijos en la empresa', 'Proceso de sucesión', 'Comunicación en el directorio', 'Otra situación'].map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
      </div>
      <div style={{ gridColumn: '1 / -1' }}>
        <Field label="Contame brevemente qué está pasando">
          <textarea rows={4} style={{ ...inputStyle, resize: 'none' }} value={form.mensaje} onChange={update('mensaje')} />
        </Field>
      </div>
      <div style={{ gridColumn: '1 / -1', display: 'flex', alignItems: 'center', gap: 16 }}>
        <button type="submit" disabled={status === 'sending'} style={{ background: 'var(--acento)', color: 'var(--paper)', padding: '13px 28px', borderRadius: 999, border: 'none', fontSize: 14, cursor: 'pointer' }}>
          {status === 'sending' ? 'Enviando…' : 'Enviar consulta'}
        </button>
        {status === 'error' && <p style={{ fontSize: 14, color: 'var(--acento)' }}>No se pudo enviar. Probá de nuevo.</p>}
      </div>
    </form>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <label style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{label}</label>
      {children}
    </div>
  );
}

function OverlapDiagram() {
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 150); return () => clearTimeout(t); }, []);
  const base = { transition: 'all 1s ease-out', opacity: ready ? 1 : 0 };
  return (
    <svg viewBox="0 0 400 400" style={{ width: '100%', aspectRatio: '1/1' }}>
      <circle cx="150" cy="200" r="120" fill="none" stroke="var(--secundario)" strokeWidth="1.5" style={{ ...base, transform: ready ? 'translateX(0)' : 'translateX(24px)' }} />
      <circle cx="250" cy="200" r="120" fill="none" stroke="var(--acento)" strokeWidth="1.5" style={{ ...base, transform: ready ? 'translateX(0)' : 'translateX(-24px)', transitionDelay: '.15s' }} />
      <text x="95" y="120" fill="#5B5560" fontFamily="IBM Plex Mono, monospace" fontSize="13">FAMILIA</text>
      <text x="255" y="120" fill="#5B5560" fontFamily="IBM Plex Mono, monospace" fontSize="13">EMPRESA</text>
    </svg>
  );
}

function LoginForm({ onLogin }) {
  const [email, setEmail] = useState('');
  const [clave, setClave] = useState('');
  const [error, setError] = useState('');
  const [aviso, setAviso] = useState('');
  const [cargando, setCargando] = useState(false);
  const [verClave, setVerClave] = useState(false);
  const [modo, setModo] = useState('login'); // 'login' | 'recuperar'

  async function entrar(e) {
    e.preventDefault();
    if (!email.trim() || !clave.trim()) return;
    setCargando(true); setError('');
    try {
      await iniciarSesionConCredenciales(email.trim(), clave.trim());
      onLogin();
    } catch (err) {
      setError(err.message);
    } finally {
      setCargando(false);
    }
  }

  async function recuperar(e) {
    e.preventDefault();
    if (!email.trim()) { setError('Escribí tu mail primero.'); return; }
    setCargando(true); setError(''); setAviso('');
    try {
      await pedirRecuperarClave(email.trim());
      setAviso('Si ese mail está registrado, te llegó un link para restablecer la contraseña.');
    } catch (err) {
      setError(err.message);
    } finally {
      setCargando(false);
    }
  }

  const inputStyle = { width: '100%', background: 'white', border: '1px solid var(--line)', color: 'var(--ink)', padding: '10px 12px', fontSize: 14, borderRadius: 10 };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--paper)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <form onSubmit={modo === 'login' ? entrar : recuperar} style={{ width: '100%', maxWidth: 340, background: 'white', border: '1px solid var(--line)', borderRadius: 20, padding: 32 }}>
        <img src={LOGO_DEFAULT} alt="" style={{ width: 56, height: 56, objectFit: 'contain', borderRadius: 8, marginBottom: 12 }} />
        <p className="mono" style={{ fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--acento)', marginBottom: 8 }}>
          {modo === 'login' ? 'Panel privado' : 'Recuperar contraseña'}
        </p>
        <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, color: 'var(--ink)', marginBottom: 24 }}>Valentina De la Fuente</h1>
        {error && <p style={{ color: '#B3261E', fontSize: 13.5, marginBottom: 10 }}>{error}</p>}
        {aviso && <p style={{ color: 'var(--secundario)', fontSize: 13.5, marginBottom: 10 }}>{aviso}</p>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <input type="email" autoFocus value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Correo" autoCapitalize="none" style={inputStyle} />
          {modo === 'login' && (
            <div style={{ position: 'relative' }}>
              <input type={verClave ? 'text' : 'password'} value={clave} onChange={(e) => setClave(e.target.value)} placeholder="Contraseña"
                style={{ ...inputStyle, paddingRight: 62 }} />
              <button type="button" onClick={() => setVerClave((v) => !v)}
                style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', border: 'none', background: 'none', color: 'var(--ink-soft)', fontSize: 11, cursor: 'pointer' }}>
                {verClave ? 'Ocultar' : 'Ver'}
              </button>
            </div>
          )}
          <button type="submit" disabled={cargando}
            style={{ marginTop: 6, width: '100%', background: 'var(--acento)', color: 'var(--paper)', padding: '10px 16px', fontSize: 14, border: 'none', borderRadius: 999, cursor: 'pointer', opacity: cargando ? 0.6 : 1 }}>
            {cargando ? '…' : modo === 'login' ? 'Entrar' : 'Enviar link de recuperación'}
          </button>
          <button type="button" onClick={() => { setModo(modo === 'login' ? 'recuperar' : 'login'); setError(''); setAviso(''); }}
            style={{ border: 'none', background: 'none', color: 'var(--ink-soft)', fontSize: 12, cursor: 'pointer', marginTop: 2 }}>
            {modo === 'login' ? '¿Olvidaste tu contraseña?' : '← Volver a iniciar sesión'}
          </button>
        </div>
      </form>
    </div>
  );
}

function TabCEO() {
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      const [leads, gastos, biblioteca] = await Promise.all([
        vvFetch('leads?select=id,estado'),
        vvFetch('gastos?select=fecha,monto'),
        vvFetch('documentos?select=estado'),
      ]);
      const inicioMes = new Date().toISOString().slice(0, 7);
      const gastosMes = gastos.filter((g) => g.fecha.slice(0, 7) === inicioMes).reduce((a, g) => a + Number(g.monto), 0);
      setStats({
        total: leads.length,
        nuevos: leads.filter((l) => l.estado === 'nuevo').length,
        gastosMes,
        documentos: biblioteca.filter((d) => d.estado === 'listo').length,
      });
    })();
  }, []);

  if (!stats) return <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Cargando…</p>;

  const Stat = ({ label, value }) => (
    <div style={{ border: '1px solid var(--line)', padding: 24 }}>
      <p className="display" style={{ fontSize: 32, margin: 0 }}>{value}</p>
      <p style={{ fontSize: 12, color: 'var(--ink-soft)', marginTop: 4 }}>{label}</p>
    </div>
  );

  return (
    <div>
      <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, marginBottom: 24 }}>Resumen</h1>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
        <Stat label="Leads totales" value={stats.total} />
        <Stat label="Sin contactar" value={stats.nuevos} />
        <Stat label="Gastos este mes" value={`$${stats.gastosMes.toLocaleString('es-AR')}`} />
        <Stat label="Docs en biblioteca" value={stats.documentos} />
      </div>
    </div>
  );
}

function TabComercial() {
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [enviando, setEnviando] = useState(null);
  const { inputStyle } = React.useContext(PanelStyleContext);

  const fetchLeads = useCallback(async () => {
    setLoading(true);
    const data = await vvFetch('leads?select=*&order=created_at.desc&limit=500');
    setLeads(data);
    setLoading(false);
  }, []);

  useEffect(() => { fetchLeads(); }, [fetchLeads]);

  async function cambiarEstado(id, estado) {
    setLeads((prev) => prev.map((l) => (l.id === id ? { ...l, estado } : l)));
    await vvFetch(`leads?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ estado, updated_at: new Date().toISOString() }) });
  }

  async function enviarPresentacion(id) {
    setEnviando(id);
    await api('/api/leads', { method: 'POST', body: { id } }).catch(() => {});
    setEnviando(null);
  }

  if (loading) return <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Cargando…</p>;

  return (
    <div>
      <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, marginBottom: 24 }}>Leads</h1>
      {!leads.length ? <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Todavía no llegó ninguna consulta.</p> : (
        <table style={{ width: '100%', textAlign: 'left', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ fontSize: 11, color: 'var(--ink-soft)', textTransform: 'uppercase' }}>
              <th style={{ paddingBottom: 8, fontWeight: 400 }}>Nombre</th>
              <th style={{ fontWeight: 400 }}>Email</th>
              <th style={{ fontWeight: 400 }}>Situación</th>
              <th style={{ fontWeight: 400 }}>Estado</th>
              <th style={{ fontWeight: 400 }}></th>
            </tr>
          </thead>
          <tbody>
            {leads.map((l) => (
              <tr key={l.id} style={{ borderTop: '1px solid var(--line)' }}>
                <td style={{ padding: '12px 0', fontSize: 14 }}>{l.nombre}</td>
                <td style={{ fontSize: 14, color: 'var(--ink-soft)' }}>{l.email}</td>
                <td style={{ fontSize: 13, color: 'var(--ink-soft)' }}>{l.situacion}</td>
                <td>
                  <select value={l.estado} onChange={(e) => cambiarEstado(l.id, e.target.value)} style={{ ...inputStyle, padding: '4px 8px', fontSize: 12 }}>
                    {['nuevo', 'contactado', 'primera_entrevista', 'en_proceso', 'cerrado', 'descartado'].map((e) => (
                      <option key={e} value={e}>{e.replaceAll('_', ' ')}</option>

                </td>
                <td style={{ textAlign: 'right' }}>
                  <button onClick={() => enviarPresentacion(l.id)} disabled={enviando === l.id}

                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );

  const fetchProspectos = useCallback(async () => setProspectos(await vvFetch('prospectos?select=*&order=created_at.desc&limit=300')), []);
  useEffect(() => { fetchProspectos(); }, [fetchProspectos]);

  function toggle(arr, setArr, v) { setArr(arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]); }

  async function buscar() {
    setBuscando(true);
    setError('');
    try {
      await api('/api/prospectos', { method: 'POST', body: { zonas, rubros } });
    } catch (err) {
      setError(err.data?.error || 'No se pudo completar la búsqueda');
    }
    await fetchProspectos();
    setBuscando(false);
  }

  async function cambiarEstado(id, estado) {
    setProspectos((prev) => prev.map((p) => (p.id === id ? { ...p, estado } : p)));
    await vvFetch(`prospectos?id=eq.${id}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ estado }) });
  }

  return (
    <div>
      <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, marginBottom: 8 }}>Buscar empresas y derivadores</h1>
      <p style={{ fontSize: 14, color: 'var(--ink-soft)', marginBottom: 24, maxWidth: 640 }}>
        Elegí dónde y a quién buscar. Se recorren sitios públicos, cámaras del rubro y directorios — solo información pública.
      </p>
      <div style={card}>
        <p className="mono" style={{ fontSize: 11, textTransform: 'uppercase', color: 'var(--acento)', marginBottom: 12 }}>Dónde buscar</p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
          {[...ZONAS_BASE, ...zonasExtra].map((z) => <Chip key={z} active={zonas.includes(z)} onClick={() => toggle(zonas, setZonas, z)}>{z}</Chip>)}
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 32 }}>
          <input value={zonaCustom} onChange={(e) => setZonaCustom(e.target.value)} placeholder="Otra zona…" style={{ ...inputStyle, flex: 1 }} />
          <button type="button" onClick={() => { if (!zonaCustom.trim()) return; setZonasExtra((p) => [...p, zonaCustom.trim()]); setZonas((p) => [...p, zonaCustom.trim()]); setZonaCustom(''); }}
            style={{ fontSize: 14, border: '1px solid var(--line)', borderRadius: 999, padding: '0 16px', background: 'white', cursor: 'pointer' }}>+ Agregar</button>
        </div>
        <p className="mono" style={{ fontSize: 11, textTransform: 'uppercase', color: 'var(--acento)', marginBottom: 12 }}>A quién buscar</p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 32 }}>
          {RUBROS_BASE.map((r) => <Chip key={r.value} active={rubros.includes(r.value)} onClick={() => toggle(rubros, setRubros, r.value)}>{r.label}</Chip>)}
        </div>
        <button onClick={buscar} disabled={buscando || !zonas.length || !rubros.length} style={btn}>{buscando ? 'Buscando…' : 'Empezar a buscar'}</button>
        {error && <p style={{ color: 'var(--acento)', fontSize: 14, marginTop: 12 }}>{error}</p>}
      </div>

      <div style={{ marginTop: 40 }}>
        {!prospectos.length ? <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Todavía no se encontró nada.</p> : (
          <table style={{ width: '100%', textAlign: 'left', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ fontSize: 11, color: 'var(--ink-soft)', textTransform: 'uppercase' }}>
                <th style={{ paddingBottom: 8, fontWeight: 400 }}>Nombre</th><th style={{ fontWeight: 400 }}>Rubro</th>
                <th style={{ fontWeight: 400 }}>Zona</th><th style={{ fontWeight: 400 }}>Contacto</th><th style={{ fontWeight: 400 }}>Estado</th>
              </tr>
            </thead>
            <tbody>
              {prospectos.map((p) => (
                <tr key={p.id} style={{ borderTop: '1px solid var(--line)' }}>
                  <td style={{ padding: '12px 0', fontSize: 14 }}>{p.nombre}</td>
                  <td style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{p.rubro}</td>
                  <td style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{p.zona}</td>
                  <td style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{p.email || p.telefono || '—'}</td>
                  <td>
                    <select value={p.estado} onChange={(e) => cambiarEstado(p.id, e.target.value)} style={{ ...inputStyle, padding: '4px 8px', fontSize: 12 }}>
                      {['sin_contactar', 'contactado', 'respondido', 'descartado'].map((e) => <option key={e} value={e}>{e.replaceAll('_', ' ')}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function MailsNuevoEnvio() {
  const [contactos, setContactos] = useState([]);
  const [sel, setSel] = useState(new Set());
  const [form, setForm] = useState({ remitente: '', responder_a: '', asunto: '', cuerpo: 'Hola {{nombre}},\n\n', incluir_cta: true, adjuntar_cv: true });
  const [enviando, setEnviando] = useState(false);
  const [resultado, setResultado] = useState(null);
  const { btn, inputStyle } = React.useContext(PanelStyleContext);

  useEffect(() => {
    (async () => {
      const [leads, prospectos] = await Promise.all([
        vvFetch('leads?select=id,nombre,email&email=not.is.null'),
        vvFetch('prospectos?select=id,nombre,email&email=not.is.null'),
      ]);
      setContactos([
        ...leads.map((l) => ({ id: `lead:${l.id}`, nombre: l.nombre, email: l.email, tipo: 'lead' })),

  async function enviar() {
    setEnviando(true);

      setResultado(`Enviado a ${data.enviados}, ${data.errores} error(es).`);

      setResultado(err.data?.error || 'Error al enviar');
    }
    setEnviando(false);
  }

  return (
    <div style={{ border: '1px solid var(--line)', padding: 24, display: 'flex', flexDirection: 'column', gap: 20 }}>
      <Field label="Remitente"><input style={{ ...inputStyle, width: '100%' }} value={form.remitente} onChange={(e) => setForm((f) => ({ ...f, remitente: e.target.value }))} placeholder="Valentina De la Fuente <consultas@tudominio.com>" /></Field>
      <Field label="Responder a (opcional)"><input style={{ ...inputStyle, width: '100%' }} value={form.responder_a} onChange={(e) => setForm((f) => ({ ...f, responder_a: e.target.value }))} /></Field>
      <Field label="Asunto"><input style={{ ...inputStyle, width: '100%' }} value={form.asunto} onChange={(e) => setForm((f) => ({ ...f, asunto: e.target.value }))} /></Field>
      <Field label="Cuerpo (usá {{nombre}} para personalizar)"><textarea rows={8} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={form.cuerpo} onChange={(e) => setForm((f) => ({ ...f, cuerpo: e.target.value }))} /></Field>
      <label style={{ fontSize: 14, display: 'flex', gap: 8, alignItems: 'center' }}>
        <input type="checkbox" checked={form.incluir_cta} onChange={(e) => setForm((f) => ({ ...f, incluir_cta: e.target.checked }))} /> Incluir botón "Ver más"
      </label>
      <label style={{ fontSize: 14, display: 'flex', gap: 8, alignItems: 'center' }}>
        <input type="checkbox" checked={form.adjuntar_cv} onChange={(e) => setForm((f) => ({ ...f, adjuntar_cv: e.target.checked }))} /> Incluir link al CV
      </label>
      <div style={{ borderTop: '1px solid var(--line)', paddingTop: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
          <p style={{ fontSize: 14 }}>{sel.size} de {contactos.length} contactos con mail seleccionados</p>
          <div style={{ display: 'flex', gap: 12 }}>
            <button onClick={() => setSel(new Set(contactos.map((c) => c.id)))} style={{ background: 'none', border: 'none', color: 'var(--acento)', fontSize: 12, cursor: 'pointer' }}>Todos</button>
            <button onClick={() => setSel(new Set())} style={{ background: 'none', border: 'none', color: 'var(--ink-soft)', fontSize: 12, cursor: 'pointer' }}>Ninguno</button>
          </div>
        </div>
        <div style={{ maxHeight: 220, overflowY: 'auto', border: '1px solid var(--line)', borderRadius: 10 }}>
          {contactos.map((c) => (
            <label key={c.id} style={{ display: 'flex', gap: 12, alignItems: 'center', padding: '8px 12px', fontSize: 14, borderBottom: '1px solid var(--line)' }}>
              <input type="checkbox" checked={sel.has(c.id)} onChange={() => setSel((prev) => { const n = new Set(prev); n.has(c.id) ? n.delete(c.id) : n.add(c.id); return n; })} />
              <span>{c.nombre}</span><span style={{ fontSize: 12, color: 'var(--ink-soft)', marginLeft: 'auto' }}>{c.email}</span>
            </label>
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
        <button onClick={enviar} disabled={enviando || !sel.size} style={{ ...btn, width: 'fit-content' }}>{enviando ? 'Enviando…' : `Enviar a ${sel.size}`}</button>
        {resultado && <p style={{ fontSize: 14, color: 'var(--ink-soft)' }}>{resultado}</p>}
      </div>
    </div>
  );
}

function TabBiblioteca() {

  const [titulo, setTitulo] = useState('');

  const [error, setError] = useState('');

  const fetchDocs = useCallback(async () => { setLoadingList(true); setDocumentos(await vvFetch('documentos?select=*&order=created_at.desc')); setLoadingList(false); }, []);

  async function subir(e) {
    e.preventDefault();
    if (!archivo) return;
    setSubiendo(true);
    setError('');
    try {
      const dataBase64 = await fileToBase64(archivo);
      await api('/api/biblioteca', { method: 'POST', body: { titulo: titulo || archivo.name, categoria, filename: archivo.name, dataBase64 } });
      setTitulo(''); setArchivo(null);
    } catch (err) {
      setError(err.data?.error || 'No se pudo subir el archivo');

    await fetchDocs();
    setSubiendo(false);

  return (
    <div>
      <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, marginBottom: 8 }}>Biblioteca</h1>
      <p style={{ fontSize: 14, color: 'var(--ink-soft)', marginBottom: 24, maxWidth: 560 }}>
        Subí PDFs de bibliografía, tests o apuntes para que la Guía los use. Los PDF escaneados sin texto no se procesan. Máximo ~4MB por archivo.

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>

          <Field label="Categoría">
            <select style={inputStyle} value={categoria} onChange={(e) => setCategoria(e.target.value)}>
              {['bibliografia', 'test', 'apunte', 'otro'].map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Archivo PDF"><input type="file" accept="application/pdf" onChange={(e) => setArchivo(e.target.files[0] || null)} /></Field>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <button type="submit" disabled={subiendo || !archivo} style={{ ...btn, width: 'fit-content' }}>{subiendo ? 'Procesando…' : 'Subir a la biblioteca'}</button>
          {error && <p style={{ color: 'var(--acento)', fontSize: 14 }}>{error}</p>}
        </div>
      </form>
      {loadingList ? <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Cargando…</p> : documentos.map((d) => (
        <div key={d.id} style={{ border: '1px solid var(--line)', padding: 16, marginBottom: 12, display: 'flex', justifyContent: 'space-between' }}>
          <div>
            <p style={{ fontSize: 14, margin: 0 }}>{d.titulo}</p>
            <p style={{ fontSize: 12, color: 'var(--ink-soft)', margin: '4px 0 0' }}>{d.categoria} · {d.estado === 'listo' ? `${d.paginas || '?'} páginas` : d.estado}</p>
          </div>
        </div>
      ))}
    </div>
  );
}

function TabGastos() {
  const [gastos, setGastos] = useState([]);
  const [form, setForm] = useState({ fecha: new Date().toISOString().slice(0, 10), categoria: 'consultorio', descripcion: '', monto: '' });
  const [saving, setSaving] = useState(false);
  const { btn, inputStyle } = React.useContext(PanelStyleContext);

  const fetchGastos = useCallback(async () => setGastos(await vvFetch('gastos?select=*&order=fecha.desc&limit=200')), []);
  useEffect(() => { fetchGastos(); }, [fetchGastos]);

  async function guardar() {
    setSaving(true);
    await vvFetch('gastos', { method: 'POST', body: JSON.stringify({ ...form, monto: Number(form.monto) }) });
    setForm((f) => ({ ...f, descripcion: '', monto: '' }));
    await fetchGastos();
    setSaving(false);
  }

  const totalMes = gastos.filter((g) => g.fecha.slice(0, 7) === new Date().toISOString().slice(0, 7)).reduce((a, g) => a + Number(g.monto), 0);

  return (
    <div>

      <p style={{ fontSize: 14, color: 'var(--ink-soft)', marginBottom: 24 }}>Total de este mes: <strong>${totalMes.toLocaleString('es-AR')}</strong></p>
      <div style={{ border: '1px solid var(--line)', padding: 24, marginBottom: 32, display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 16, alignItems: 'end' }}>
        <Field label="Fecha"><input type="date" style={inputStyle} value={form.fecha} onChange={(e) => setForm((f) => ({ ...f, fecha: e.target.value }))} /></Field>
        <Field label="Categoría">
          <select style={inputStyle} value={form.categoria} onChange={(e) => setForm((f) => ({ ...f, categoria: e.target.value }))}>
            {['consultorio', 'insumos', 'marketing', 'impuestos', 'formacion', 'otro'].map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <div style={{ gridColumn: 'span 2' }}>
          <Field label="Descripción"><input style={{ ...inputStyle, width: '100%' }} value={form.descripcion} onChange={(e) => setForm((f) => ({ ...f, descripcion: e.target.value }))} /></Field>
        </div>
        <Field label="Monto"><input type="number" style={inputStyle} value={form.monto} onChange={(e) => setForm((f) => ({ ...f, monto: e.target.value }))} /></Field>
        <button onClick={guardar} disabled={saving} style={{ ...btn, gridColumn: '1 / -1', width: 'fit-content' }}>{saving ? 'Guardando…' : 'Cargar gasto'}</button>
      </div>
      <table style={{ width: '100%', textAlign: 'left', borderCollapse: 'collapse' }}>
        <thead><tr style={{ fontSize: 11, color: 'var(--ink-soft)', textTransform: 'uppercase' }}>
          <th style={{ paddingBottom: 8, fontWeight: 400 }}>Fecha</th><th style={{ fontWeight: 400 }}>Categoría</th><th style={{ fontWeight: 400 }}>Descripción</th><th style={{ fontWeight: 400 }}>Monto</th>
        </tr></thead>
        <tbody>
          {gastos.map((g) => (
            <tr key={g.id} style={{ borderTop: '1px solid var(--line)' }}>
              <td style={{ padding: '10px 0', fontSize: 13, color: 'var(--ink-soft)' }}>{g.fecha}</td>
              <td style={{ fontSize: 13, color: 'var(--ink-soft)' }}>{g.categoria}</td>
              <td style={{ fontSize: 14 }}>{g.descripcion || '—'}</td>
              <td style={{ fontSize: 14 }}>${Number(g.monto).toLocaleString('es-AR')}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function TabDiseno() {
  const [cfg, setCfg] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [fotoFile, setFotoFile] = useState(null);
  const [logoFile, setLogoFile] = useState(null);
  const [cvFile, setCvFile] = useState(null);
  const [fotoPreview, setFotoPreview] = useState(null);
  const [logoPreview, setLogoPreview] = useState(null);
  const [saving, setSaving] = useState(false);
  const [ok, setOk] = useState(false);
  const { btn, inputStyle } = React.useContext(PanelStyleContext);

  const [error, setError] = useState('');

  useEffect(() => {
    api('/api/operaciones').then((d) => {
      setCfg({ ...d.config, foto_url: cacheBust(d.foto_url), logo_url: cacheBust(d.logo_url) });
      setPerfil({ ...d.perfil, especialidades: (d.perfil?.especialidades || []).join(', '), cv_url: d.cv_url });
    }).catch((err) => setError(err.message || 'No se pudo cargar Diseño'));
  }, []);

  function cacheBust(url) {
    if (!url) return url;
    return `${url}${url.includes('?') ? '&' : '?'}v=${Date.now()}`;
  }

  function elegirFoto(e) {
    const f = e.target.files[0] || null;
    setFotoFile(f);
    setFotoPreview(f ? URL.createObjectURL(f) : null);
  }
  function elegirLogo(e) {
    const f = e.target.files[0] || null;
    setLogoFile(f);
    setLogoPreview(f ? URL.createObjectURL(f) : null);
  }

  async function guardar() {
    setSaving(true);
    setOk(false);
    setError('');
    try {
      const body = { config: { ...cfg }, perfil: { ...perfil } };
      delete body.config.foto_url; delete body.config.logo_url;
      delete body.perfil.cv_url;
      if (fotoFile) body.foto = { dataBase64: await fileToBase64(fotoFile), contentType: fotoFile.type };
      if (logoFile) body.logo = { dataBase64: await fileToBase64(logoFile), contentType: logoFile.type };
      if (cvFile) body.cv = { dataBase64: await fileToBase64(cvFile), contentType: cvFile.type };
      await api('/api/operaciones', { method: 'POST', body }).then((r) => {
        if (r.avisos?.length) setError(r.avisos.join(' · '));
      });
      const d = await api('/api/operaciones');
      setCfg({ ...d.config, foto_url: cacheBust(d.foto_url), logo_url: cacheBust(d.logo_url) });
      setPerfil({ ...d.perfil, especialidades: (d.perfil?.especialidades || []).join(', '), cv_url: d.cv_url });
      if (fotoFile && !d.foto_url) setError('La foto se subió pero el link público no se generó — revisá que el bucket "sitio" exista y sea público.');
      else if (logoFile && !d.logo_url) setError('El logo se subió pero el link público no se generó — revisá que el bucket "sitio" exista y sea público.');
      setFotoFile(null); setLogoFile(null); setCvFile(null);
      setFotoPreview(null); setLogoPreview(null);
      setOk(true);
    } catch (err) {
      setError(err.message || 'No se pudo guardar');
    }
    setSaving(false);
  }

  if (error && (!cfg || !perfil)) {
    return <p style={{ color: '#B3261E', fontSize: 14 }}>{error}</p>;
  }
  if (!cfg || !perfil) return <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Cargando…</p>;

  const box = { border: '1px solid var(--line)', background: 'white', borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0 };

  return (
    <div style={{ maxWidth: 640 }}>
      <h1 className="display" style={{ fontStyle: 'italic', fontSize: 24, marginBottom: 4 }}>Personalizar la marca</h1>
      <p style={{ fontSize: 14, color: 'var(--ink-soft)', marginBottom: 32 }}>Logo, foto, colores, textos del inicio y perfil profesional (CV) — todo en un solo panel.</p>

      <Section title="Logo (opcional)">
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          <div style={{ ...box, width: 96, height: 96 }}>{(logoPreview || cfg.logo_url) ? <img src={logoPreview || cfg.logo_url} style={{ width: '100%', height: '100%', objectFit: 'contain', padding: 8 }} /> : <span className="mono" style={{ fontSize: 9, color: 'var(--ink-soft)' }}>SIN LOGO</span>}</div>
          <input type="file" accept="image/*" onChange={elegirLogo} />
        </div>
      </Section>

      <Section title="Foto de portada">
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          <div style={{ ...box, width: 96, height: 112 }}>{(fotoPreview || cfg.foto_url) ? <img src={fotoPreview || cfg.foto_url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <span className="mono" style={{ fontSize: 9, color: 'var(--ink-soft)' }}>SIN FOTO</span>}</div>
          <input type="file" accept="image/*" onChange={elegirFoto} />
        </div>
      </Section>

      <Section title="Colores">
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }}>
          <ColorField label="Acento" value={cfg.color_acento} onChange={(v) => setCfg((c) => ({ ...c, color_acento: v }))} />
          <ColorField label="Secundario" value={cfg.color_secundario} onChange={(v) => setCfg((c) => ({ ...c, color_secundario: v }))} />
          <ColorField label="Fondo" value={cfg.color_fondo} onChange={(v) => setCfg((c) => ({ ...c, color_fondo: v }))} />
        </div>
      </Section>

      <Section title="Textos del inicio">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <Field label="Nombre / marca"><input style={{ ...inputStyle, width: '100%' }} value={cfg.nombre_marca || ''} onChange={(e) => setCfg((c) => ({ ...c, nombre_marca: e.target.value }))} /></Field>
          <Field label="Título principal"><textarea rows={2} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.titulo_hero || ''} onChange={(e) => setCfg((c) => ({ ...c, titulo_hero: e.target.value }))} /></Field>
          <Field label="Subtítulo"><textarea rows={3} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.subtitulo_hero || ''} onChange={(e) => setCfg((c) => ({ ...c, subtitulo_hero: e.target.value }))} /></Field>
          <Field label="Texto del botón"><input style={{ ...inputStyle, width: '100%' }} value={cfg.cta_texto || ''} onChange={(e) => setCfg((c) => ({ ...c, cta_texto: e.target.value }))} /></Field>
        </div>
      </Section>

      <Section title='Sección "Para quién"'>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <Field label="Título"><textarea rows={2} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.para_quien_titulo || ''} onChange={(e) => setCfg((c) => ({ ...c, para_quien_titulo: e.target.value }))} /></Field>
          <Field label="Texto"><textarea rows={4} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.para_quien_texto || ''} onChange={(e) => setCfg((c) => ({ ...c, para_quien_texto: e.target.value }))} /></Field>
        </div>
      </Section>

      <Section title="Las 4 áreas de trabajo">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          {[1, 2, 3, 4].map((n) => (
            <div key={n} style={{ borderTop: '1px solid var(--line)', paddingTop: 14 }}>
              <p className="mono" style={{ fontSize: 10, color: 'var(--secundario)', marginBottom: 8 }}>ÁREA {n}</p>
              <Field label="Título"><input style={{ ...inputStyle, width: '100%', marginBottom: 10 }} value={cfg[`area${n}_titulo`] || ''} onChange={(e) => setCfg((c) => ({ ...c, [`area${n}_titulo`]: e.target.value }))} /></Field>
              <Field label="Texto"><textarea rows={3} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg[`area${n}_texto`] || ''} onChange={(e) => setCfg((c) => ({ ...c, [`area${n}_texto`]: e.target.value }))} /></Field>
            </div>
          ))}
        </div>
      </Section>

      <Section title='Sección "Sobre mí"'>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <Field label="Primer párrafo"><textarea rows={4} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.sobre_mi_texto1 || ''} onChange={(e) => setCfg((c) => ({ ...c, sobre_mi_texto1: e.target.value }))} /></Field>
          <Field label="Segundo párrafo"><textarea rows={3} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={cfg.sobre_mi_texto2 || ''} onChange={(e) => setCfg((c) => ({ ...c, sobre_mi_texto2: e.target.value }))} /></Field>
        </div>
      </Section>

      <Section title="Perfil profesional (para los mails)">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
          <Field label="Título"><input style={{ ...inputStyle, width: '100%' }} value={perfil.titulo || ''} onChange={(e) => setPerfil((p) => ({ ...p, titulo: e.target.value }))} /></Field>
          <Field label="Matrícula"><input style={{ ...inputStyle, width: '100%' }} value={perfil.matricula || ''} onChange={(e) => setPerfil((p) => ({ ...p, matricula: e.target.value }))} /></Field>
        </div>
        <div style={{ marginBottom: 16 }}>
          <Field label="Especialidades (separadas por coma)"><input style={{ ...inputStyle, width: '100%' }} value={perfil.especialidades || ''} onChange={(e) => setPerfil((p) => ({ ...p, especialidades: e.target.value }))} /></Field>
        </div>
        <div style={{ marginBottom: 16 }}>
          <Field label="Bio corta"><textarea rows={3} style={{ ...inputStyle, width: '100%', resize: 'none' }} value={perfil.bio || ''} onChange={(e) => setPerfil((p) => ({ ...p, bio: e.target.value }))} /></Field>
        </div>
        <Field label={<span>CV (PDF) {perfil.cv_url && <a href={perfil.cv_url} target="_blank" style={{ color: 'var(--acento)', marginLeft: 8 }}>ver el actual</a>}</span>}>
          <input type="file" accept="application/pdf" onChange={(e) => setCvFile(e.target.files[0] || null)} />
        </Field>
      </Section>

      <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
        <button onClick={guardar} disabled={saving} style={btn}>{saving ? 'Guardando…' : 'Guardar cambios'}</button>
        {ok && <p style={{ fontSize: 14, color: 'var(--secundario)' }}>Guardado. Ya se ve en el sitio.</p>}
        {error && <p style={{ fontSize: 14, color: '#B3261E' }}>{error}</p>}
      </div>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ marginBottom: 36 }}>
      <p className="mono" style={{ fontSize: 11, textTransform: 'uppercase', color: 'var(--acento)', marginBottom: 16 }}>{title}</p>
      {children}
    </div>
  );
}

function ColorField({ label, value, onChange }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <label style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{label}</label>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, border: '1px solid var(--line)', background: 'white', padding: '8px 10px', borderRadius: 10 }}>
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} style={{ width: 28, height: 28, border: 'none', padding: 0, background: 'none', cursor: 'pointer' }} />
        <input type="text" value={value} onChange={(e) => onChange(e.target.value)} style={{ fontSize: 12, flex: 1, border: 'none', outline: 'none', minWidth: 0 }} />
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------
// Selector de arriba de todo: Sitio | Centro de Operaciones (por hash,
// nunca cambia de URL de verdad — igual que V+V con sus marcas)
// ---------------------------------------------------------------------
function SelectorTop({ activo, onCambiar }) {
  return (
    <div style={{ position: 'sticky', top: 0, zIndex: 100, background: '#171217', padding: '9px 14px', display: 'flex', gap: 6, overflowX: 'auto' }}>
      <button onClick={() => onCambiar('sitio')} style={{
        border: 'none', borderRadius: 20, padding: '7px 14px', fontSize: 11.5, fontWeight: 700, whiteSpace: 'nowrap', cursor: 'pointer',
        background: activo === 'sitio' ? 'var(--acento)' : 'transparent', color: activo === 'sitio' ? '#fff' : '#C9C1BE',
      }}>Valentina De la Fuente</button>
      <button onClick={() => onCambiar('operaciones')} style={{
        border: 'none', borderRadius: 20, padding: '7px 14px', fontSize: 11.5, fontWeight: 700, whiteSpace: 'nowrap', cursor: 'pointer',
        background: activo === 'operaciones' ? 'var(--acento)' : 'transparent', color: activo === 'operaciones' ? '#fff' : '#C9C1BE',
      }}>Centro de Operaciones</button>
    </div>
  );
}

const MAPA_HASH = { '': 'sitio', '#operaciones': 'operaciones' };

function Sitio() {
  const [vista, setVista] = useState(MAPA_HASH[window.location.hash] || 'sitio');

  function ir(v) {
    setVista(v);
    window.location.hash = v === 'operaciones' ? '#operaciones' : '';
  }

  useEffect(() => {
    const f = () => {
      const h = window.location.hash;
      if (Object.prototype.hasOwnProperty.call(MAPA_HASH, h)) setVista(MAPA_HASH[h]);
    };
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);

  return (
    <div>
      <SelectorTop activo={vista} onCambiar={ir} />
      {vista === 'sitio' && <Landing />}
      {vista === 'operaciones' && <CentroOperaciones />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Sitio />);
</script>
